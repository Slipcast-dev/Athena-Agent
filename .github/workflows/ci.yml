name: macOS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 script/verify_ecosystem_dependency.py
      - run: swift test
      - run: swift test --package-path Packages/EcosystemKit
      - run: swift build -c release
      - run: ./script/build_and_run.sh --package
        env:
          ECOSYSTEM_SKIP_LSREGISTER: '1'
